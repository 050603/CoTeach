groups:
  - name: openpbl
    rules:
      - alert: OpenPblTargetDown
        expr: up{job="openpbl"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: CoTeach metrics target is unavailable
      - alert: OpenPblHttpErrorRateHigh
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.005
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: CoTeach HTTP 5xx rate exceeds 0.5%
      - alert: OpenPblHttpP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: CoTeach HTTP p95 exceeds 500 ms
      - alert: OpenPblEventLoopLagHigh
        expr: nodejs_eventloop_lag_p99_seconds > 0.2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: CoTeach Node.js event-loop p99 lag exceeds 200 ms
      - alert: OpenPblHeapPressure
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: CoTeach Node.js heap usage exceeds 80%
      - alert: OpenPblHostDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
          /
          node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: CoTeach host disk has less than 15% free
      - alert: OpenPblContainerRestarting
        expr: changes(container_start_time_seconds{name=~".*openpbl.*"}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: A CoTeach container is repeatedly restarting
      - alert: OpenPblPostgresConnectionsHigh
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: PostgreSQL connections exceed 80% of max_connections
      - alert: OpenPblRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Redis memory usage exceeds 80%
      - alert: OpenPblDatabaseBackupStale
        expr: time() - openpbl_backup_last_success_timestamp_seconds{kind="postgres"} > 93600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: PostgreSQL backup has not succeeded in 26 hours
      - alert: OpenPblVolumeBackupStale
        expr: time() - openpbl_backup_last_success_timestamp_seconds{kind="volumes"} > 93600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: Upload/whiteboard backup has not succeeded in 26 hours
      - alert: OpenPblCertificateExpiring
        expr: openpbl_certificate_expires_within_48h == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: CoTeach TLS certificate expires within 48 hours
